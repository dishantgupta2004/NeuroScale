# ============================================================================
# Production nginx config.
#
# Routing
# -------
#   yourdomain.com/         -> Streamlit frontend (with WebSocket support)
#   yourdomain.com/api/     -> FastAPI backend (rewrites to /...)
#   yourdomain.com/health   -> simple liveness from nginx itself
#
# Hardening
# ---------
#   - HTTP -> HTTPS redirect.
#   - HTTP/2 on 443.
#   - HSTS (after you've confirmed TLS works — DON'T enable on day 1).
#   - Rate limit on /api/auth/ to slow brute-force.
#   - Sensible client_max_body_size for uploads.
#
# Replace `yourdomain.com` everywhere before deploying.
# ============================================================================

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Cap upload size to backend's MAX_UPLOAD_MB + a little headroom.
    client_max_body_size 30M;

    # Compression — Streamlit assets benefit a lot.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ----------------------------------------------------------------
    # Rate limiting — auth endpoints are the obvious brute-force target
    # ----------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;

    # ----------------------------------------------------------------
    # Upstreams (named for readability)
    # ----------------------------------------------------------------
    upstream backend_upstream {
        server backend:8000;
    }
    upstream frontend_upstream {
        server frontend:8501;
    }

    # ================================================================
    # HTTP -> HTTPS redirect
    # ================================================================
    server {
        listen 80;
        server_name yourdomain.com;

        # Allow ACME challenge for Let's Encrypt cert renewals.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ================================================================
    # HTTPS server
    # ================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name yourdomain.com;

        ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        # Modern TLS only — drops old IE / Android < 5.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Enable AFTER you've confirmed everything works.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ------------------------------------------------------------
        # Liveness — short-circuited at nginx, doesn't hit anything.
        # ------------------------------------------------------------
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ------------------------------------------------------------
        # API routes -> backend
        # ------------------------------------------------------------
        # Strict rate limit on auth (signup/login)
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend_upstream/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Other API
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            # Long timeouts for /generate-content (agent runs are slow).
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://backend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------
        # Streamlit — needs WebSocket upgrade for live updates
        # ------------------------------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;   # long-lived WS connections
        }
    }
}